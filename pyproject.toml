[project]
name = "hushboard"
version = "1.0.0"
description = "Accountless feedback with a refundable shielded Zcash testnet bond"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "qrcode[pil]==8.2",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
addopts = "-ra --strict-markers"
