[project]
name = "hushboard"
version = "1.0.0"
description = "Accountless feedback with a refundable shielded Zcash testnet bond"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "qrcode[pil]==8.2",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
addopts = "-ra --strict-markers"
